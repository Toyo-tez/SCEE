name: Dependency submission

# Submits the resolved Gradle dependency graph (all projects incl. buildSrc) to GitHub so that
# Dependency review and Dependabot alerts can see Gradle/Kotlin dependencies. Nothing is built or tested.
#
# - push to SCEE-mc / manual run on SCEE-mc: graph is generated AND submitted (contents: write)
# - pull_request: graph is only generated and uploaded as an artifact with a READ-ONLY token
#   (PR code never runs with a write token, also for forks). The artifact is submitted by
#   dependency-submission-pr.yml, which does not check out or execute any PR code.
# The PR path filter must stay in sync with the regex in dependency-review.yml.

on:
  # No path filter on push: every SCEE-mc commit gets a snapshot, so a PR's base commit always has one.
  push:
    branches:
      - "SCEE-mc"
  pull_request:
    branches:
      - "SCEE-mc"
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "**/build.gradle.kts"
      - "buildSrc/**"
      - "third_party/osmfeatures/**"
      - ".github/workflows/dependency-submission*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  submit:
    name: Submit dependency graph
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/SCEE-mc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1
        with:
          dependency-graph: generate-and-submit
          additional-arguments: --no-configuration-cache

  generate-pr:
    name: Generate dependency graph (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Generate and upload dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1
        with:
          dependency-graph: generate-and-upload
          additional-arguments: --no-configuration-cache
          artifact-retention-days: 7
